<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile</title>
    <link rel="stylesheet" href="style.css">


    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-green-100 min-h-screen flex items-center justify-center">

    <div class="bg-white w-80 rounded-2xl shadow-lg p-6 text-center">

        <!-- Profile Picture -->
        <div class="w-28 h-28 mx-auto mb-4">
            <img src="profile.jpg"
                 alt="Fe Marie M. Macapobre Profile Picture"
                 class="w-28 h-28 rounded-full object-cover">
        </div>

        <!-- Name -->
        <h1 class="text-2xl font-bold text-gray-800">
            Fe Marie M. Macapobre
        </h1>

        <!-- Position -->
        <p class="text-green-600 font-medium mt-1">
            BSIT Student
        </p>

        <!-- Description -->
        <p class="text-gray-500 text-sm mt-4">
            Hello! I'm Fe Marie M. Macapobre. I am a student
            who enjoys learning about technology, programming,
            and creating simple websites.
        </p>

        <!-- Information -->
        <div class="mt-5 text-left space-y-2">

            <p class="text-gray-600">
                <span class="font-medium">Location:</span> Philippines
            </p>

            <p class="text-gray-600">
                <span class="font-medium">Interest:</span> Web Development
            </p>

            <p class="text-gray-600">
                <span class="font-medium">Course:</span> BS Information Technology
            </p>

        </div>

        <!-- Button -->
        <button class="mt-6 w-full bg-green-600 text-white py-2 rounded-lg
                       hover:bg-green-700 transition">
            View Profile
        </button>

    </div>

</body>
</html>
