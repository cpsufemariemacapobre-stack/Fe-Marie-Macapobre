<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPSU Login Page</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .left {
            width: 50%;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .login-box {
            width: 80%;
            max-width: 400px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #eee;
            border: 4px solid #7b2cbf;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #7b2cbf;
            font-size: 25px;
            font-weight: bold;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: #7b2cbf;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
        }

        .right {
            width: 50%;
            background: #7b2cbf;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .right h2 {
            color: white;
            margin-bottom: 25px;
        }

        button {
            padding: 12px 18px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            cursor: pointer;
        }

        .click-btn {
            background: white;
            color: #7b2cbf;
        }

        .color-btn {
            background: #333;
            color: white;
        }

        @media (max-width: 700px) {
            .container {
                flex-direction: column;
            }

            .left,
            .right {
                width: 100%;
                min-height: 50vh;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="left">

        <div class="login-box">

            <div class="logo">
                CPSU
            </div>

            <h1>Login</h1>

            <input
                type="text"
                id="username"
                placeholder="Username"
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
            >

            <button class="login-btn" onclick="login()">
                Login
            </button>

        </div>

    </div>


    <div class="right" id="purpleSection">

        <div>

            <h2 id="message">
                Welcome to CPSU!
            </h2>

            <button class="click-btn" onclick="clickMe()">
                Click me
            </button>

            <button class="color-btn" onclick="changeColor()">
                Change Color
            </button>

        </div>

    </div>

</div>


<script>

function clickMe() {
    document.getElementById("message").innerHTML =
        "You clicked the button!";
}

function changeColor() {
    document.getElementById("purpleSection").style.backgroundColor =
        "pink";
}

function login() {

    let username =
        document.getElementById("username").value;

    let password =
        document.getElementById("password").value;

    if (username === "" || password === "") {

        alert("Please enter your username and password.");

    } else {

        alert("Login successful!");

    }
}

</script>

</body>
</html>
